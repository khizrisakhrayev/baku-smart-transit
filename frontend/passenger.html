<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakı Ağıllı Nəqliyyat — Sərnişin</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🚌 Bakı Ağıllı Nəqliyyat</div>
    <nav class="nav">
      <a href="passenger.html" class="active">Sərnişin</a>
      <a href="operator.html">Operator</a>
    </nav>
    <span id="live-indicator" class="live-indicator" title="Məlumat yenilənməsi">Polling</span>
  </header>

  <main class="layout">
    <div id="map" class="map"></div>

    <aside class="sidebar">
      <section class="card">
        <h2>Marşrutlar <span class="muted">(3-ə qədər)</span></h2>
        <div class="route-add">
          <input id="route-search" class="input" type="search" placeholder="Nömrə, marşrut və ya dayanacaq…"
                 aria-label="Marşrut axtar">
          <select id="route-select" class="input" aria-label="Marşrut əlavə et"></select>
        </div>
        <ul id="route-chips" class="chips"></ul>
      </section>

      <section id="eta-card" class="card" hidden>
        <div class="card-head">
          <h2 id="eta-title"></h2>
          <button class="close" data-close="eta-card" aria-label="Bağla">×</button>
        </div>
        <ul id="eta-list" class="eta-list"></ul>
      </section>

      <section class="card">
        <h2>Dayanacaqlar</h2>
        <p class="hint">Gəliş vaxtı üçün dayanacağa, sıxlığı bildirmək üçün avtobusa toxunun.</p>
        <div id="stop-list"></div>
      </section>

      <section class="card legend" aria-label="Sıxlıq rəngləri">
        <span><i class="dot density-low"></i>Aşağı</span>
        <span><i class="dot density-medium"></i>Orta</span>
        <span><i class="dot density-high"></i>Yüksək</span>
        <span><i class="dot density-unknown"></i>Məlum deyil</span>
      </section>
    </aside>
  </main>

  <section id="bus-panel" class="sheet" hidden>
    <div class="card-head">
      <h2 id="bus-title"></h2>
      <button class="close" data-close="bus-panel" aria-label="Bağla">×</button>
    </div>
    <p>Hazırkı sıxlıq: <span id="bus-density" class="badge"></span></p>
    <p class="hint">Avtobus nə qədər doludur?</p>
    <div class="report-buttons">
      <button class="btn density-low" data-level="low">Aşağı</button>
      <button class="btn density-medium" data-level="medium">Orta</button>
      <button class="btn density-high" data-level="high">Yüksək</button>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/common.js"></script>
  <script src="js/passenger.js"></script>
</body>
</html>
